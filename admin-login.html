<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1110">
    <title>Admin Login | Leonard Ho</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            max-width: 720px;
            margin: 0 auto;
            padding: 6rem 6vw;
        }

        .login-panel {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
            padding: 1.35rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .login-field {
            display: grid;
            gap: 0.45rem;
        }

        .login-field span {
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 800;
        }

        .login-field input {
            width: 100%;
            min-height: 44px;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font: inherit;
        }

        .login-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
        }

        .login-panel details {
            display: grid;
            gap: 0.9rem;
            padding-top: 0.35rem;
        }

        .login-panel summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 800;
        }

        .login-status {
            color: var(--muted);
            white-space: pre-wrap;
        }

        .setup-note {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Leonard Ho home">
            <img class="brand-mark" src="img/logo-wa.png" alt="" width="34" height="34" decoding="async">
            <span>Leonard Ho</span>
        </a>
        <nav id="site-nav" class="site-nav" aria-label="Login navigation">
            <a href="index.html#photography">Photography</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="login-page">
        <p class="eyebrow">Private Admin</p>
        <h1>Login</h1>
        <p class="login-status">Sign in with your admin username and password.</p>

        <form id="login-form" class="login-panel">
            <label class="login-field">
                <span>Username / email</span>
                <input id="admin-username" name="adminUsername" type="email" autocomplete="username" placeholder="you@example.com" required>
            </label>
            <label class="login-field">
                <span>Password</span>
                <input id="admin-password" name="adminPassword" type="password" autocomplete="current-password" required>
            </label>
            <div class="login-actions">
                <button class="button primary" type="submit">Login</button>
            </div>
            <details>
                <summary class="muted-label">Supabase setup</summary>
                <p id="setup-note" class="setup-note"></p>
                <label class="login-field">
                    <span>Supabase URL</span>
                    <input id="supabase-url" name="supabaseUrl" placeholder="https://your-project.supabase.co" required>
                </label>
                <label class="login-field">
                    <span>Supabase publishable key</span>
                    <input id="supabase-anon-key" name="supabaseAnonKey" required>
                </label>
                <label class="login-field">
                    <span>Storage bucket</span>
                    <input id="photo-bucket" name="photoBucket" value="album-photos" required>
                </label>
                <div class="login-actions">
                    <button id="save-config" class="button secondary" type="button">Save Setup</button>
                </div>
            </details>
            <p id="login-status" class="login-status" role="status"></p>
        </form>
    </main>

    <script src="js/cms-config.js"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const form = document.querySelector("#login-form");
        const status = document.querySelector("#login-status");
        const setupNote = document.querySelector("#setup-note");
        const siteConfig = window.SUPABASE_CONFIG || {};
        const hasSiteConfig = Boolean(siteConfig.url && siteConfig.anonKey);
        const fields = {
            url: document.querySelector("#supabase-url"),
            anonKey: document.querySelector("#supabase-anon-key"),
            bucket: document.querySelector("#photo-bucket"),
            username: document.querySelector("#admin-username"),
            password: document.querySelector("#admin-password"),
        };

        function stored(key, fallback = "") {
            try {
                return localStorage.getItem(key) || fallback;
            } catch {
                return fallback;
            }
        }

        function store(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch {
                // Login still works for the current page even if browser storage is unavailable.
            }
        }

        function saveConfig() {
            store("portfolio.supabaseUrl", fields.url.value.trim());
            store("portfolio.supabaseAnonKey", fields.anonKey.value.trim());
            store("portfolio.supabasePhotoBucket", fields.bucket.value.trim() || "album-photos");
            store("portfolio.adminUsername", fields.username.value.trim());
        }

        fields.url.value = siteConfig.url || stored("portfolio.supabaseUrl");
        fields.anonKey.value = siteConfig.anonKey || stored("portfolio.supabaseAnonKey");
        fields.bucket.value = siteConfig.photoBucket || stored("portfolio.supabasePhotoBucket", "album-photos");
        fields.username.value = stored("portfolio.adminUsername") || stored("portfolio.adminEmail");
        setupNote.textContent = hasSiteConfig
            ? "Supabase setup is already loaded from the site config."
            : "Fill this once if the site config has not been added yet.";

        document.querySelector("#save-config").addEventListener("click", () => {
            saveConfig();
            status.textContent = "Config saved in this browser.";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            saveConfig();
            if (!fields.url.value.trim() || !fields.anonKey.value.trim()) {
                status.textContent = "Add the Supabase URL and publishable key in Supabase setup first.";
                return;
            }
            const supabase = createClient(fields.url.value.trim(), fields.anonKey.value.trim());
            const { error } = await supabase.auth.signInWithPassword({
                email: fields.username.value.trim(),
                password: fields.password.value,
            });
            if (error) {
                status.textContent = `Login failed:\n${error.message}`;
                return;
            }
            fields.password.value = "";
            status.textContent = "Logged in. Opening admin...";
            window.location.href = "admin.html";
        });

        if (fields.url.value && fields.anonKey.value) {
            const supabase = createClient(fields.url.value.trim(), fields.anonKey.value.trim());
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                status.textContent = "You are already signed in. Open the admin page.";
            }
        }
    </script>
</body>

</html>
